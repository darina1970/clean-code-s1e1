<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen"
    >
  </head>
  <body class="page">
    <header class="header">
      <img 
        class="header__image" 
        src="./eisenhower-matrix.jpg" 
        alt="Eisenhower Matrix"
      >
      <a 
        class="header__link"  
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main">
      <section id="task-input">
        <label class="task-input__label" for="task-input__field">Add Item</label>
        <div class="task-input__wrapper">
          <input 
            id="task-input__field"
            class="task-input__field"
            type="text"
          >
          <button class="task-input__btn btn">Add</button>
        </div>
      </section>
      <section class="task-list task-list_incomplete">
        <h3 class="task-list__title">Todo</h3>
        <ul class="task-list__items" id="task-list_incomplete">
          <li class="task">
            <input class="task__checkbox" type="checkbox">
            <label class="task__label">Pay Bills</label>
            <input class="task__input" type="text">
            <button class="task-edit__btn btn">Edit</button>
            <button class="task-delete__btn">
              <img 
                class="task-delete__icon" 
                src="./remove.svg" 
                alt="delete icon"
              >
            </button>
          </li>
          <li class="task task_edit-mode">
            <input class="task__checkbox" type="checkbox">
            <label class="task__label">Go Shopping</label>
            <input 
              type="text" 
              value="Go Shopping" 
              class="task__input"
            >
            <button class="task-edit__btn btn">Save</button>
            <button class="task-delete__btn">
              <img 
                class="task-delete__icon" 
                src="./remove.svg" 
                alt="delete icon"
              >
            </button>
          </li>
        </ul>
      </section>
      <section class="task-list task-list_completed">
        <h3 class="task-list__title">Completed</h3>
        <ul class="task-list__items" id="task-list_completed">
          <li class="task task_completed">
            <input class="task__checkbox" type="checkbox" checked>
            <label class="task__label">See the Doctor</label>
            <input class="task__input" type="text">
            <button class="task-edit__btn btn">Edit</button>
            <button class="task-delete__btn">
              <img 
                class="task-delete__icon" 
                src="./remove.svg" 
                alt="delete icon"
              >
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
